[project]
name = "lookout"
version = "0.1.0"
description = "Lookout v1: daily-summary agent that orients Mal to the day ahead. NOT Scout."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "langfuse>=4.7.0",
    "httpx>=0.27",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
lookout = "lookout.run:main"
lookout-eval = "lookout.evals:main"
lookout-batch = "lookout.batch:main"
lookout-cases = "lookout.cases:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookout"]
